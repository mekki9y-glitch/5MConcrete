name: Build APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android SDK and NDK
        run: |
          # إنشاء المجلدات المطلوبة
          mkdir -p ~/.buildozer/android/platform
          
          # إنشاء روابط رمزية للـ SDK و NDK الموجودين في بيئة GitHub
          # هذا يتجاوز محاولة التنزيل من Google
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          ln -s /usr/local/lib/android/sdk/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25b
          
          # قبول تراخيص Android SDK
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev aidl
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36 virtualenv

      - name: Build APK with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export BUILDOZER_WARN_ON_ROOT=0
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 5MConcrete-APK
          path: bin/*.apk
